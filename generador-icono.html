<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de íconos - Aula 6.o</title>

  <style>
    /* ---------- Variables (la misma paleta de la app) ---------- */
    :root {
      --color-principal: #D6457C;
      --color-principal-oscuro: #B8346A;
      --color-violeta: #9B8AE0;
      --color-violeta-suave: #EEEAFB;
      --color-fondo: #FAF7FC;
      --color-blanco: #FFFFFF;
      --color-texto: #2B2433;
      --color-texto-suave: #6B6477;
      --color-borde: #E7E1F0;
      --radio: 16px;
      --radio-chico: 10px;
      --sombra-suave: 0 4px 14px rgba(91, 75, 176, 0.10);
      --sombra-elevada: 0 8px 20px rgba(214, 69, 124, 0.22);
    }

    /* ---------- Base ---------- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1.25rem 1rem 2.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--color-texto);
      background: var(--color-fondo);
      overflow-x: clip; /* nada puede generar scroll horizontal */
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      line-height: 1.25;
    }

    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .descripcion {
      margin: 0 0 1.25rem;
      color: var(--color-texto-suave);
    }

    /* ---------- Tarjetas ---------- */
    .tarjeta {
      padding: 1.25rem;
      background: var(--color-blanco);
      border: 1px solid var(--color-borde);
      border-radius: var(--radio);
      box-shadow: var(--sombra-suave);
    }

    /* ---------- Controles ---------- */
    .controles {
      display: grid;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--color-texto-suave);
    }

    input[type="text"] {
      width: 100%;
      min-height: 44px;            /* tamaño cómodo para tocar con el dedo */
      margin-top: 0.35rem;
      padding: 0.4rem 0.8rem;
      font: inherit;
      font-size: 1.5rem;           /* el emoji se ve grande en el campo */
      text-align: center;
      color: var(--color-texto);
      background: var(--color-blanco);
      border: 1px solid var(--color-borde);
      border-radius: var(--radio-chico);
    }

    .fila-color {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.35rem;
    }

    input[type="color"] {
      width: 4rem;
      min-height: 44px;
      padding: 0.2rem;
      background: var(--color-blanco);
      border: 1px solid var(--color-borde);
      border-radius: var(--radio-chico);
      cursor: pointer;
    }

    #textoColor {
      font-family: ui-monospace, Consolas, monospace;
      font-weight: 600;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--color-violeta);
      outline-offset: 2px;
    }

    /* ---------- Vistas previas ---------- */
    .previas {
      display: flex;
      flex-wrap: wrap;             /* en el celular quedan una debajo de la otra */
      align-items: flex-start;
      gap: 1.25rem;
    }

    .previa {
      display: grid;
      gap: 0.75rem;
      justify-items: start;
      max-width: 100%;
      min-width: 0;
    }

    /* Cuadrículas de fondo: dejan ver que las esquinas son transparentes */
    .fondo-cuadros {
      max-width: 100%;
      line-height: 0;
      border-radius: var(--radio-chico);
      background:
        conic-gradient(#E9E4F2 25%, #FFFFFF 0 50%, #E9E4F2 0 75%, #FFFFFF 0) 0 0 / 20px 20px;
    }

    canvas {
      display: block;
      max-width: 100%;             /* en pantallas chicas se achica solo en pantalla */
      height: auto;                /* (el archivo descargado conserva su tamaño real) */
    }

    .medida {
      margin: 0;
      font-size: 0.9rem;
      color: var(--color-texto-suave);
    }

    /* ---------- Botones ---------- */
    button {
      min-height: 44px;
      padding: 0.65rem 1.2rem;
      font: inherit;
      font-weight: 600;
      color: var(--color-blanco);
      background: var(--color-principal);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(214, 69, 124, 0.25);
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      background: var(--color-principal-oscuro);
      transform: translateY(-2px);
      box-shadow: var(--sombra-elevada);
    }

    button:active {
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }

      button:hover {
        transform: none;
      }
    }

    /* ---------- Desde 768 px: controles en una fila ---------- */
    @media (min-width: 768px) {
      body {
        padding: 2rem;
      }

      .controles {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>🎨 Generador de íconos</h1>
    <p class="descripcion">
      Elegí un emoji y un color. Los cambios se ven en vivo y después descargás los PNG.
    </p>

    <!-- ===== Controles ===== -->
    <section class="tarjeta controles" aria-label="Controles">
      <div>
        <label for="campoEmoji">Emoji (escribilo o pegalo)</label>
        <input type="text" id="campoEmoji" value="🎓" autocomplete="off" spellcheck="false">
      </div>

      <div>
        <label for="campoColor">Color de fondo</label>
        <div class="fila-color">
          <input type="color" id="campoColor" value="#2F80ED">
          <span id="textoColor">#2F80ED</span>
        </div>
      </div>
    </section>

    <!-- ===== Vistas previas ===== -->
    <section class="tarjeta" aria-label="Vistas previas">
      <h2>Vistas previas</h2>

      <div class="previas">
        <div class="previa">
          <div class="fondo-cuadros">
            <canvas id="lienzo192" width="192" height="192" role="img" aria-label="Ícono de 192 por 192 píxeles"></canvas>
          </div>
          <p class="medida">192 × 192 px</p>
          <button type="button" id="botonDescargar192">Descargar icono-192.png</button>
        </div>

        <div class="previa">
          <div class="fondo-cuadros">
            <canvas id="lienzo512" width="512" height="512" role="img" aria-label="Ícono de 512 por 512 píxeles"></canvas>
          </div>
          <p class="medida">512 × 512 px</p>
          <button type="button" id="botonDescargar512">Descargar icono-512.png</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    /* ==========================================================
       Generador de íconos: dibuja en un <canvas> un fondo de color
       con esquinas redondeadas y un emoji grande en el centro.
       ========================================================== */

    // ---------- 1. AJUSTES ----------
    const MARGEN_SEGURIDAD = 0.10;  // 10 % de cada lado: el emoji no puede tocar los bordes
    const RADIO_ESQUINAS = 0.22;    // esquinas redondeadas = 22 % del lado del ícono

    // Fuentes de emoji de cada sistema (Apple, Windows, Android/Linux)
    const FUENTES_EMOJI = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';

    // ---------- 2. ELEMENTOS DEL HTML ----------
    const campoEmoji = document.getElementById("campoEmoji");
    const campoColor = document.getElementById("campoColor");
    const textoColor = document.getElementById("textoColor");
    const lienzo192 = document.getElementById("lienzo192");
    const lienzo512 = document.getElementById("lienzo512");
    const botonDescargar192 = document.getElementById("botonDescargar192");
    const botonDescargar512 = document.getElementById("botonDescargar512");

    // ---------- 3. DIBUJO ----------

    // Traza (sin pintar) un cuadrado con las cuatro esquinas redondeadas
    function trazarRectanguloRedondeado(contexto, x, y, ancho, alto, radio) {
      contexto.beginPath();
      contexto.moveTo(x + radio, y);
      contexto.arcTo(x + ancho, y, x + ancho, y + alto, radio);
      contexto.arcTo(x + ancho, y + alto, x, y + alto, radio);
      contexto.arcTo(x, y + alto, x, y, radio);
      contexto.arcTo(x, y, x + ancho, y, radio);
      contexto.closePath();
    }

    // Dibuja un ícono completo en el lienzo que le pasemos
    function dibujarIcono(lienzo, emoji, color) {
      const contexto = lienzo.getContext("2d");
      const lado = lienzo.width; // el ícono es cuadrado

      // Se borra todo: las esquinas quedan transparentes
      contexto.clearRect(0, 0, lado, lado);

      // Fondo de color con esquinas redondeadas
      trazarRectanguloRedondeado(contexto, 0, 0, lado, lado, lado * RADIO_ESQUINAS);
      contexto.fillStyle = color;
      contexto.fill();

      if (emoji === "") return; // sin emoji, queda solo el fondo

      // Zona donde puede estar el dibujo: el lado menos el margen de ambos costados
      const margen = lado * MARGEN_SEGURIDAD;
      const zona = lado - margen * 2;

      contexto.textAlign = "center";
      contexto.textBaseline = "alphabetic";

      // 1) Medimos el emoji con un tamaño de prueba
      const tamanoPrueba = zona;
      contexto.font = tamanoPrueba + "px " + FUENTES_EMOJI;
      let medidas = contexto.measureText(emoji);

      const anchoPrueba = medidas.actualBoundingBoxLeft + medidas.actualBoundingBoxRight || medidas.width;
      const altoPrueba = medidas.actualBoundingBoxAscent + medidas.actualBoundingBoxDescent || tamanoPrueba;
      if (!anchoPrueba || !altoPrueba) return;

      // 2) Elegimos el tamaño más grande que entra en la zona (sin pasar el margen)
      const escala = Math.min(zona / anchoPrueba, zona / altoPrueba);
      const tamano = tamanoPrueba * escala;

      // 3) Volvemos a medir con el tamaño final para centrarlo bien
      contexto.font = tamano + "px " + FUENTES_EMOJI;
      medidas = contexto.measureText(emoji);

      const izquierda = medidas.actualBoundingBoxLeft || medidas.width / 2;
      const derecha = medidas.actualBoundingBoxRight || medidas.width / 2;
      const arriba = medidas.actualBoundingBoxAscent || tamano * 0.8;
      const abajo = medidas.actualBoundingBoxDescent || 0;

      const x = lado / 2 + (izquierda - derecha) / 2;
      const y = lado / 2 + (arriba - abajo) / 2;

      contexto.fillStyle = "#000000"; // los emoji a color ignoran este valor
      contexto.fillText(emoji, x, y);
    }

    // Vuelve a dibujar los dos íconos con lo que hay en los campos
    function actualizar() {
      const emoji = campoEmoji.value.trim();
      const color = campoColor.value;

      dibujarIcono(lienzo192, emoji, color);
      dibujarIcono(lienzo512, emoji, color);
      textoColor.textContent = color.toUpperCase();
    }

    // ---------- 4. DESCARGA ----------

    // Convierte el lienzo en un PNG y lo descarga con el nombre indicado
    function descargar(lienzo, nombreArchivo) {
      const direccion = lienzo.toDataURL("image/png"); // la imagen como texto (data URL)

      const enlace = document.createElement("a");
      enlace.href = direccion;
      enlace.download = nombreArchivo;
      document.body.append(enlace);
      enlace.click(); // "toca" el enlace para empezar la descarga
      enlace.remove();
    }

    // ---------- 5. EVENTOS ----------
    // "input" se dispara con cada tecla o cada cambio de color: por eso es en vivo
    campoEmoji.addEventListener("input", actualizar);
    campoColor.addEventListener("input", actualizar);

    botonDescargar192.addEventListener("click", function () {
      descargar(lienzo192, "icono-192.png");
    });

    botonDescargar512.addEventListener("click", function () {
      descargar(lienzo512, "icono-512.png");
    });

    // ---------- 6. INICIO ----------
    actualizar();
  </script>
</body>
</html>
