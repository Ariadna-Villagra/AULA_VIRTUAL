<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 6.o</title>

  <!-- Tipografías de Google Fonts: Poppins (títulos) e Inter (texto).
       Si no hay internet, styles.css usa system-ui como respaldo. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap">

  <!-- Color de la barra del navegador en el celular (el rosa principal) -->
  <meta name="theme-color" content="#D6457C">

  <!-- Hoja de estilos propia: va después de las fuentes -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===================== ENCABEZADO ===================== -->
  <header id="encabezado">
    <h1>Aula 6.o</h1>

    <!-- Selector para cambiar el rol con el que se ve la aplicación -->
    <label for="selectorRol">Ver como</label>
    <select id="selectorRol">
      <option value="docente">Docente</option>
      <option value="alumno">Alumno</option>
    </select>

    <!-- Botones para guardar y recuperar los datos en un archivo -->
    <button type="button" id="botonExportar">Exportar</button>
    <button type="button" id="botonImportar">Importar</button>

    <!-- Input oculto: el botón "Importar" lo va a activar desde JS -->
    <input type="file" id="archivoImportar" accept=".json" hidden>
  </header>

  <!-- Mensaje de Exportar / Importar (error o éxito). Si está vacío, no se ve -->
  <p id="mensajeArchivo" class="mensaje-error aviso-archivo" role="alert"></p>

  <main>

    <!-- Nombre del alumno: se pide una sola vez y queda guardado -->
    <form id="formularioAlumno" class="solo-alumno" novalidate>
      <div id="pedirNombreAlumno">
        <label for="nombreAlumnoActual">¿Cómo te llamás? (usá un nombre ficticio)</label>
        <input type="text" id="nombreAlumnoActual" placeholder="Ej: Luna Ficticia" maxlength="40" autocomplete="off">
        <p id="errorAlumno" class="mensaje-error" role="alert"></p>
        <div class="acciones-formulario">
          <button type="submit">Guardar nombre</button>
        </div>
      </div>

      <div id="saludoAlumno" hidden>
        <p id="textoSaludo"></p>
        <button type="button" id="botonCambiarNombre" class="boton-chico boton-secundario">Cambiar nombre</button>
      </div>
    </form>

    <!-- ===================== VISTA 1: MIS CURSOS ===================== -->
    <section id="vistaCursos">
      <h2>Mis cursos</h2>

      <!-- Acá JS va a dibujar una tarjeta por cada curso -->
      <div id="grillaCursos"></div>

      <!-- Formulario para crear un curso nuevo -->
      <!-- Clase solo-docente: el alumno no ve este formulario -->
      <!-- novalidate: los mensajes de error los muestra nuestro JS -->
      <form id="formularioCurso" class="solo-docente" novalidate>
        <h3 id="tituloFormularioCurso">Crear curso</h3>

        <label for="nombreCurso">Nombre del curso</label>
        <input type="text" id="nombreCurso" required>

        <label for="codigoCurso">Código (3 a 8 letras o números)</label>
        <input type="text" id="codigoCurso" maxlength="8" required>

        <label for="docenteCurso">Docente</label>
        <input type="text" id="docenteCurso">

        <label for="colorCurso">Color de la franja</label>
        <select id="colorCurso">
          <option value="#D6457C">Rosa</option>
          <option value="#9B8AE0">Violeta</option>
          <option value="#F29BBE">Rosa claro</option>
          <option value="#3BB3A8">Turquesa</option>
          <option value="#F2A33C">Naranja</option>
        </select>

        <label for="descripcionCurso">Descripción</label>
        <textarea id="descripcionCurso" rows="3"></textarea>

        <!-- Acá JS escribe el mensaje de error (si no hay error, queda vacío y se oculta) -->
        <p id="errorCurso" class="mensaje-error" role="alert"></p>

        <div class="acciones-formulario">
          <button type="submit" id="botonGuardarCurso">Crear curso</button>
          <!-- Solo aparece cuando se está editando un curso -->
          <button type="button" id="botonCancelarCurso" class="boton-secundario" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <!-- ===================== VISTA 2: CURSO (MURO) ===================== -->
    <section id="vistaCurso" hidden>
      <button type="button" id="botonVolverCursos">Volver a Mis cursos</button>

      <h2 id="tituloCurso"></h2>

      <!-- Formulario para publicar material o una tarea en el muro -->
      <!-- Clase solo-docente: el alumno no puede publicar -->
      <form id="formularioPublicacion" class="solo-docente" novalidate>
        <h3 id="tituloFormularioPublicacion">Nueva publicación</h3>

        <label for="tipoPublicacion">Tipo de publicación</label>
        <select id="tipoPublicacion">
          <option value="texto">Texto</option>
          <option value="enlace">Enlace</option>
          <option value="archivo">Archivo</option>
          <option value="tarea" id="opcionTarea">Tarea</option>
        </select>

        <label for="tituloPublicacion">Título</label>
        <input type="text" id="tituloPublicacion" required>

        <!-- Los tres grupos siguientes: JS muestra solo el que corresponde al tipo elegido -->
        <div id="grupoTexto">
          <label for="textoPublicacion">Texto</label>
          <textarea id="textoPublicacion" rows="4"></textarea>
        </div>

        <div id="grupoEnlace" hidden>
          <label for="enlacePublicacion">Enlace (tiene que empezar con https://)</label>
          <input type="text" id="enlacePublicacion" placeholder="https://ejemplo.com">
        </div>

        <div id="grupoArchivo" hidden>
          <label for="archivoPublicacion">Archivo (solo se guarda el nombre)</label>
          <input type="file" id="archivoPublicacion">
          <p id="archivoActual" class="ayuda-campo"></p>
        </div>

        <div id="grupoTarea" hidden>
          <label for="consignaPublicacion">Consigna</label>
          <textarea id="consignaPublicacion" rows="4"></textarea>

          <label for="fechaLimitePublicacion">Fecha y hora límite</label>
          <input type="datetime-local" id="fechaLimitePublicacion">

          <label for="puntajePublicacion">Puntaje máximo</label>
          <input type="number" id="puntajePublicacion" min="1" step="1" value="10">
        </div>

        <!-- Mensaje de error del formulario -->
        <p id="errorPublicacion" class="mensaje-error" role="alert"></p>

        <div class="acciones-formulario">
          <button type="submit" id="botonGuardarPublicacion">Publicar</button>
          <!-- Solo aparece cuando se está editando un material -->
          <button type="button" id="botonCancelarPublicacion" class="boton-secundario" hidden>Cancelar</button>
        </div>
      </form>

      <!-- Lista vacía: JS va a agregar acá las publicaciones del muro -->
      <ul id="listaPublicaciones"></ul>
    </section>

    <!-- ===================== VISTA 3: TAREA ===================== -->
    <section id="vistaTarea" hidden>
      <button type="button" id="botonVolverCurso">Volver al curso</button>

      <h2 id="tituloTarea"></h2>

      <!-- Consigna de la tarea (JS va a escribir el texto) -->
      <article id="consignaTarea"></article>

      <!-- Formulario para que el alumno entregue la tarea -->
      <form id="formularioEntrega" class="solo-alumno" novalidate>
        <h3 id="tituloFormularioEntrega">Entregar tarea</h3>

        <label for="tipoEntrega">Qué vas a entregar</label>
        <select id="tipoEntrega">
          <option value="texto">Texto</option>
          <option value="enlace">Enlace</option>
        </select>

        <div id="grupoTextoEntrega">
          <label for="textoEntrega">Tu respuesta</label>
          <textarea id="textoEntrega" rows="5"></textarea>
        </div>

        <div id="grupoEnlaceEntrega" hidden>
          <label for="enlaceEntrega">Enlace (tiene que empezar con https://)</label>
          <input type="text" id="enlaceEntrega" placeholder="https://ejemplo.com">
        </div>

        <p id="errorEntrega" class="mensaje-error" role="alert"></p>

        <div class="acciones-formulario">
          <button type="submit" id="botonGuardarEntrega">Entregar</button>
          <!-- Solo aparece cuando se está editando una entrega -->
          <button type="button" id="botonCancelarEntrega" class="boton-secundario" hidden>Cancelar</button>
        </div>
      </form>

      <!-- Lista de entregas realizadas -->
      <h3 id="tituloEntregas">Entregas</h3>
      <p id="resumenEntregas" class="resumen-entregas"></p>
      <ul id="listaEntregas"></ul>
    </section>

  </main>

  <!-- Enlace al JavaScript (todavía está vacío). Va al final para que el HTML cargue primero -->
  <script src="app.js"></script>
</body>
</html>
